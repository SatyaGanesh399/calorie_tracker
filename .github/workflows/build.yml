name: Build debug APK

# Runs on every push and pull request, and can be triggered by hand from the
# Actions tab. Produces an installable debug APK as a downloadable artifact.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The Gradle wrapper JAR is a binary and isn't committed, so we install
      # Gradle directly instead of relying on ./gradlew. This also generates the
      # wrapper for anyone who clones the repo afterwards.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/CalorieTracker-debug-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      # When the build fails, surface the compiler output as an artifact too so
      # it's easy to copy the whole thing out rather than scrolling the log.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
          if-no-files-found: ignore

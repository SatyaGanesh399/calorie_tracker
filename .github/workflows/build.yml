name: Build debug APK

# Runs on every push and pull request, and can be triggered by hand from the
# Actions tab. Produces an installable debug APK as a downloadable artifact.
#
# When compilation fails, the Kotlin errors are extracted and written to the run
# summary page, so you never have to scroll a Gradle stack trace to find them.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The Gradle wrapper JAR is a binary and isn't committed, so we install
      # Gradle directly instead of relying on ./gradlew.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      # ------------------------------------------------------------------
      # Failure diagnostics. `e:` lines are Kotlin compile errors, `w:` are
      # warnings, and AAPT/manifest problems show up as "ERROR:" lines.
      # ------------------------------------------------------------------
      - name: Extract compile errors
        if: failure()
        run: |
          # Strip the runner's absolute path prefix so the paths are readable.
          PREFIX="file://${GITHUB_WORKSPACE}/"
          extract() { grep -E "$1" build.log | sed "s|${PREFIX}||g" | head -n 200; }

          {
            echo "## Build failed"
            echo ""
            echo "### Kotlin compile errors"
            echo '```'
            extract '^e: ' || echo "(none)"
            echo '```'
            echo ""
            echo "### Resource / manifest errors"
            echo '```'
            extract '^(ERROR|error):' || echo "(none)"
            echo '```'
            echo ""
            echo "### Gradle failure summary"
            echo '```'
            grep -E '^(FAILURE|\* What went wrong|Execution failed|> )' build.log | head -n 40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::group::Kotlin compile errors"
          extract '^e: ' || echo "(none found)"
          echo "::endgroup::"

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/
          retention-days: 14
          if-no-files-found: ignore

      # ------------------------------------------------------------------
      # Success path
      # ------------------------------------------------------------------
      - name: Rename APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/CalorieTracker-debug-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-debug-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

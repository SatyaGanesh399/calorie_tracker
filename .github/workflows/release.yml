name: Release APK

# Push a tag like v1.0 and this builds a signed release APK and attaches it to a
# GitHub Release you can install straight from your phone's browser.
#
#   git tag v1.0 && git push origin v1.0
#
# SIGNING
# -------
# If you add these four repository secrets (Settings > Secrets and variables >
# Actions), the APK is signed with your own keystore, which means you can install
# updates over the top without uninstalling first:
#
#   KEYSTORE_BASE64      base64 of your .jks file  ->  base64 -i my.jks | pbcopy
#   KEYSTORE_PASSWORD
#   KEY_ALIAS
#   KEY_PASSWORD
#
# Without them the workflow falls back to a generated debug key, which still
# installs fine — but a later switch to a real key needs an uninstall first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Assemble release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/release.jks"
            echo "Using the keystore from repository secrets."
          else
            # app/build.gradle.kts falls back to the debug keystore, so make one.
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning::No KEYSTORE_BASE64 secret set — signing with a generated debug key."
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk \
             "out/CalorieTracker-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalorieTracker-release-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            Personal build of Calorie Tracker.

            Download the APK below on your phone and open it. You'll need to allow
            "install unknown apps" for your browser the first time.
